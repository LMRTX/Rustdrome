[package]
name = "rustdrome"
version = "0.3.0"
edition = "2021"
rust-version = "1.84"
description = "A fast, animated terminal player for Navidrome — Rust + ratatui, with sixel cover art"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["navidrome", "subsonic", "music", "tui", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "rustdrome"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
color_quant = "1.1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
md5 = "0.7"
rand = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "signal"] }
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# kill-on-close job object: mpv can never outlive us (see player::job)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
